name: Check car data

on:
  pull_request:
    paths: ["cars.json", "scripts/validate.js"]
  push:
    branches: [main]
    paths: ["cars.json", "scripts/validate.js"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.js
